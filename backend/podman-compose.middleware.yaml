name: gwa-middleware

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GWA_DB_PASSWORD:?Set GWA_DB_PASSWORD}
      POSTGRES_DB: gwa
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gwa"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${GWA_REDIS_PASSWORD:?Set GWA_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${GWA_REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  storage:
    image: docker.io/chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["server", "-dir=/data", "-filer", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9333:9333"]
    volumes:
      - storage-data:/data
      - ./scripts/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  rnacos:
    image: docker.io/qingpan/rnacos:v0.8.8
    restart: unless-stopped
    environment:
      RNACOS_INIT_ADMIN_USERNAME: ${GWA_NACOS_USER:?Set GWA_NACOS_USER}
      RNACOS_INIT_ADMIN_PASSWORD: ${GWA_NACOS_PASSWORD:?Set GWA_NACOS_PASSWORD}
      RNACOS_ENABLE_OPEN_API_AUTH: "true"
      RNACOS_DATA_DIR: /io/nacos_db
      RNACOS_GMT_OFFSET_HOURS: "8"
    ports: ["127.0.0.1:8848:8848", "127.0.0.1:9848:9848", "127.0.0.1:10848:10848"]
    volumes: ["rnacos-data:/io"]

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    volumes:
      - ./scripts/docker/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/data

volumes:
  postgres-data:
    name: gwa-compose-pgvector-data
  redis-data:
    external: true
    name: gwa-redis-data
  storage-data:
    external: true
    name: gwa-storage-data
  rnacos-data:
    name: gwa-compose-rnacos-data
  jaeger-data:
    name: gwa-compose-jaeger-data
